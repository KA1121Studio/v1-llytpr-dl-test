<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube DL · ダウンローダー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
      padding: 1.5rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .app { max-width: 1000px; width: 100%; }
    h1 {
      font-size: 2rem; font-weight: 600;
      display: flex; align-items: center; gap: 0.5rem;
      margin-bottom: 1.5rem; color: #fff;
      letter-spacing: -0.5px;
    }
    h1 span { background: #ff0000; padding: 0.1rem 0.6rem; border-radius: 8px; font-size: 1.2rem; }
    .search-box { display: flex; gap: 10px; margin-bottom: 2rem; flex-wrap: wrap; }
    .search-box input {
      flex: 1; min-width: 200px; padding: 0.9rem 1.2rem;
      border-radius: 40px; border: 1px solid #333;
      background: #1e1e1e; color: #fff; font-size: 1rem;
      outline: none; transition: border 0.2s;
    }
    .search-box input:focus { border-color: #ff0000; }
    .search-box button {
      background: #ff0000; border: none; border-radius: 40px;
      padding: 0.9rem 2rem; font-weight: 600; font-size: 1rem;
      color: #fff; cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex; align-items: center; gap: 8px; white-space: nowrap;
    }
    .search-box button:hover { background: #cc0000; }
    .search-box button:active { transform: scale(0.97); }
    .search-box button:disabled { background: #444; cursor: not-allowed; }
    .status {
      background: #1a1a1a; border-radius: 16px;
      padding: 1rem 1.5rem; margin-bottom: 1.5rem;
      display: flex; align-items: center; gap: 12px;
      border-left: 4px solid #ff0000;
      font-size: 0.95rem; word-break: break-word;
    }
    .status.error { border-left-color: #ff4444; background: #2a1a1a; }
    .status.success { border-left-color: #00c853; }
    .video-card {
      background: #181818; border-radius: 24px;
      padding: 1.8rem; display: flex; flex-direction: column; gap: 1.5rem;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6); border: 1px solid #2a2a2a;
    }
    .video-header { display: flex; gap: 1.5rem; flex-wrap: wrap; }
    .thumbnail {
      width: 200px; height: 112px; background: #2a2a2a;
      border-radius: 16px; overflow: hidden; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: #666; font-size: 0.8rem;
    }
    .thumbnail img { width: 100%; height: 100%; object-fit: cover; }
    .video-meta { flex: 1; display: flex; flex-direction: column; gap: 0.4rem; }
    .video-title { font-size: 1.4rem; font-weight: 600; line-height: 1.3; color: #fff; }
    .channel { display: flex; align-items: center; gap: 8px; color: #aaa; font-size: 0.9rem; }
    .channel img { width: 28px; height: 28px; border-radius: 50%; background: #333; }
    .stats { display: flex; flex-wrap: wrap; gap: 1.2rem; font-size: 0.9rem; color: #aaa; margin-top: 4px; }
    .stats span { display: flex; align-items: center; gap: 4px; }
    .badge { background: #2a2a2a; border-radius: 20px; padding: 0.2rem 0.8rem; font-size: 0.8rem; color: #ddd; }
    .tabs {
      display: flex; gap: 8px; border-bottom: 1px solid #2a2a2a;
      padding-bottom: 8px; flex-wrap: wrap;
    }
    .tab-btn {
      background: transparent; border: none; color: #aaa;
      padding: 0.5rem 1.2rem; border-radius: 30px;
      font-weight: 500; cursor: pointer;
      transition: background 0.2s, color 0.2s; font-size: 0.9rem;
    }
    .tab-btn.active { background: #ff0000; color: #fff; }
    .tab-btn:hover:not(.active) { background: #2a2a2a; color: #fff; }
    .stream-list {
      display: flex; flex-direction: column; gap: 8px;
      max-height: 380px; overflow-y: auto; padding-right: 4px;
    }
    .stream-item {
      display: flex; align-items: center; justify-content: space-between;
      background: #1f1f1f; padding: 0.8rem 1.2rem;
      border-radius: 14px; transition: background 0.15s;
      border: 1px solid #2c2c2c; flex-wrap: wrap; gap: 10px;
    }
    .stream-item:hover { background: #252525; }
    .stream-info { display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap; }
    .quality { font-weight: 600; min-width: 70px; color: #fff; }
    .codec { font-size: 0.8rem; color: #888; background: #2a2a2a; padding: 0.2rem 0.6rem; border-radius: 30px; }
    .size { font-size: 0.8rem; color: #aaa; min-width: 80px; }
    .download-btn {
      background: #ff0000; border: none; border-radius: 30px;
      padding: 0.5rem 1.2rem; color: #fff; font-weight: 600;
      font-size: 0.8rem; cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    }
    .download-btn:hover { background: #cc0000; }
    .download-btn:active { transform: scale(0.96); }
    .download-btn.disabled { background: #444; pointer-events: none; opacity: 0.6; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: #666; font-size: 1rem; }
    .footer-note {
      margin-top: 1.5rem; font-size: 0.75rem; color: #555;
      text-align: center; border-top: 1px solid #222; padding-top: 1.2rem;
    }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1a1a1a; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #666; }
  </style>
</head>
<body>
<div class="app">
  <h1><span>▶</span> YouTube DL</h1>

  <div class="search-box">
    <input type="text" id="videoIdInput" placeholder="動画IDを入力 (例: 09R8_2nJtjg)" value="09R8_2nJtjg">
    <button id="fetchBtn">
      <span id="btnIcon">🔍</span>
      <span id="btnText">取得</span>
      <span id="btnSpinner" class="spinner hidden"></span>
    </button>
  </div>

  <div id="statusMessage" class="status hidden">
    <span id="statusText">準備完了</span>
  </div>

  <div id="resultContainer" class="video-card hidden">
    <div class="video-header">
      <div class="thumbnail" id="thumbnail"><span>サムネイル</span></div>
      <div class="video-meta">
        <div class="video-title" id="videoTitle">タイトル</div>
        <div class="channel" id="channelInfo">
          <img id="channelAvatar" src="" alt="" onerror="this.style.display='none'">
          <span id="channelName">チャンネル名</span>
        </div>
        <div class="stats">
          <span id="viewCount">👁 0回視聴</span>
          <span id="likeCount">👍 0</span>
          <span id="uploadDate">📅 日付</span>
          <span id="duration" class="badge">0:00</span>
        </div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="combined">🎬 映像+音声</button>
      <button class="tab-btn" data-tab="video">📹 映像のみ</button>
      <button class="tab-btn" data-tab="audio">🎵 音声のみ</button>
    </div>

    <div id="streamList" class="stream-list"></div>
  </div>

  <div class="footer-note">
    API プロキシ経由: /api/watch/ID → Vercel
  </div>
</div>

<script>
  (function() {
    const videoIdInput = document.getElementById('videoIdInput');
    const fetchBtn = document.getElementById('fetchBtn');
    const btnIcon = document.getElementById('btnIcon');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const statusMessage = document.getElementById('statusMessage');
    const statusText = document.getElementById('statusText');
    const resultContainer = document.getElementById('resultContainer');
    const thumbnail = document.getElementById('thumbnail');
    const videoTitle = document.getElementById('videoTitle');
    const channelAvatar = document.getElementById('channelAvatar');
    const channelName = document.getElementById('channelName');
    const viewCount = document.getElementById('viewCount');
    const likeCount = document.getElementById('likeCount');
    const uploadDate = document.getElementById('uploadDate');
    const duration = document.getElementById('duration');
    const streamList = document.getElementById('streamList');
    const tabBtns = document.querySelectorAll('.tab-btn');

    let currentData = null;
    let activeTab = 'combined';

    function showStatus(text, type = 'info') {
      statusMessage.classList.remove('hidden', 'error', 'success');
      if (type === 'error') statusMessage.classList.add('error');
      if (type === 'success') statusMessage.classList.add('success');
      statusText.textContent = text;
    }
    function hideStatus() { statusMessage.classList.add('hidden'); }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '不明';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }
    function formatDuration(seconds) {
      if (!seconds && seconds !== 0) return '--:--';
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const secs = Math.floor(seconds % 60);
      if (hrs > 0) return `${hrs}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function setActiveTab(tab) {
      activeTab = tab;
      tabBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tab));
      if (currentData) renderStreams(currentData);
    }

    tabBtns.forEach(btn => btn.addEventListener('click', () => setActiveTab(btn.dataset.tab)));

    function renderStreams(data) {
      const streams = data.streams || {};
      const progressive = streams.progressive || [];
      const videos = streams.videos || [];
      const audios = streams.audios || [];
      const directUrls = streams.directUrls || {};
      let items = [];

      if (activeTab === 'combined') {
        progressive.forEach(s => {
          let url = s.url || directUrls[s.itag] || null;
          if (!url && s.itag === 18 && directUrls['18']) url = directUrls['18'];
          if (url) {
            items.push({
              type: 'combined',
              quality: s.qualityLabel || '360p',
              codec: s.mime || 'video/mp4',
              size: s.contentLength ? formatBytes(s.contentLength) : '—',
              url: url, itag: s.itag, bitrate: s.bitrate
            });
          }
        });
        Object.keys(directUrls).forEach(itag => {
          const n = parseInt(itag);
          if (n === 18) return;
          if (n === 22 || n === 59) {
            if (directUrls[itag]) {
              items.push({
                type: 'combined',
                quality: n === 22 ? '720p' : '480p',
                codec: 'video/mp4',
                size: '—', url: directUrls[itag], itag: n, bitrate: 0
              });
            }
          }
        });
        const seen = new Set();
        items = items.filter(i => { if (seen.has(i.itag)) return false; seen.add(i.itag); return true; });
        items.sort((a, b) => (parseInt(b.quality) || 0) - (parseInt(a.quality) || 0));

      } else if (activeTab === 'video') {
        videos.forEach(s => {
          let url = s.url || directUrls[s.itag] || null;
          if (url) {
            items.push({
              type: 'video',
              quality: s.qualityLabel || '?',
              codec: s.mime ? s.mime.split(';')[0] : 'video',
              size: s.contentLength ? formatBytes(s.contentLength) : '—',
              url: url, itag: s.itag, bitrate: s.bitrate
            });
          }
        });
        items.sort((a, b) => (parseInt(b.quality) || 0) - (parseInt(a.quality) || 0));

      } else if (activeTab === 'audio') {
        audios.forEach(s => {
          let url = s.url || directUrls[s.itag] || null;
          if (url) {
            items.push({
              type: 'audio',
              quality: s.qualityLabel || 'audio',
              codec: s.mime ? s.mime.split(';')[0] : 'audio',
              size: s.contentLength ? formatBytes(s.contentLength) : '—',
              url: url, itag: s.itag, bitrate: s.bitrate
            });
          }
        });
        items.sort((a, b) => (b.bitrate || 0) - (a.bitrate || 0));
      }

      if (items.length === 0) {
        streamList.innerHTML = `<div class="empty-state">このカテゴリで利用可能なストリームがありません</div>`;
        return;
      }

      let html = '';
      items.forEach(item => {
        const sizeText = item.size !== '—' ? item.size : '不明';
        const codecShort = item.codec ? (item.codec.split('/')[1] || item.codec) : '—';
        html += `
          <div class="stream-item">
            <div class="stream-info">
              <span class="quality">${item.quality}</span>
              <span class="codec">${codecShort}</span>
              <span class="size">${sizeText}</span>
            </div>
            <a class="download-btn" href="${item.url}" target="_blank" rel="noopener noreferrer">⬇ ダウンロード</a>
          </div>
        `;
      });
      streamList.innerHTML = html;
    }

    async function fetchVideoData(videoId) {
      if (!videoId || videoId.trim() === '') {
        showStatus('動画IDを入力してください', 'error');
        return;
      }

      fetchBtn.disabled = true;
      btnIcon.classList.add('hidden');
      btnSpinner.classList.remove('hidden');
      btnText.textContent = '取得中...';
      showStatus('データを取得しています...', 'info');
      resultContainer.classList.add('hidden');

      try {
        // ★★★ ここが変更点: 相対パスで Netlify プロキシ経由 ★★★
        const apiUrl = `/api/watch/${encodeURIComponent(videoId.trim())}`;
        const response = await fetch(apiUrl);

        if (!response.ok) throw new Error(`APIエラー: ${response.status} ${response.statusText}`);

        const data = await response.json();
        console.log('API response:', data);
        if (!data || !data.videoId) throw new Error('無効なレスポンス: videoId がありません');

        currentData = data;
        videoTitle.textContent = data.title || 'タイトルなし';
        channelName.textContent = data.channel?.name || '不明なチャンネル';
        if (data.channel?.avatar) {
          channelAvatar.src = data.channel.avatar;
          channelAvatar.style.display = 'inline-block';
        } else {
          channelAvatar.style.display = 'none';
        }
        viewCount.textContent = `👁 ${data.viewCount || '0'}`;
        likeCount.textContent = `👍 ${data.likeCount || '0'}`;
        uploadDate.textContent = `📅 ${data.dateText || '不明'}`;
        duration.textContent = formatDuration(data.lengthSeconds);

        if (data.videoId) {
          thumbnail.innerHTML = `<img src="https://i.ytimg.com/vi/${data.videoId}/hqdefault.jpg" alt="thumbnail" onerror="this.parentElement.innerHTML='<span>NO IMAGE</span>'">`;
        } else {
          thumbnail.innerHTML = '<span>サムネイルなし</span>';
        }

        setActiveTab(activeTab);
        resultContainer.classList.remove('hidden');
        showStatus('データを取得しました', 'success');
        setTimeout(() => hideStatus(), 3000);

      } catch (err) {
        console.error(err);
        showStatus(`取得に失敗しました: ${err.message}`, 'error');
        resultContainer.classList.add('hidden');
      } finally {
        fetchBtn.disabled = false;
        btnIcon.classList.remove('hidden');
        btnSpinner.classList.add('hidden');
        btnText.textContent = '取得';
      }
    }

    fetchBtn.addEventListener('click', () => fetchVideoData(videoIdInput.value));
    videoIdInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') { e.preventDefault(); fetchVideoData(videoIdInput.value); }
    });

    window.addEventListener('load', () => {
      if (videoIdInput.value.trim() === '09R8_2nJtjg') {
        setTimeout(() => fetchVideoData(videoIdInput.value), 300);
      }
    });
  })();
</script>
</body>
</html>
