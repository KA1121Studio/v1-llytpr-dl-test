<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Stream Inspector</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #e2e5ea;
    --text: #1f2329;
    --text-sub: #5f6672;
    --accent: #2f6fed;
    --accent-hover: #1e5bd6;
    --danger: #d92d20;
    --success: #12805c;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 2rem 1rem;
    min-height: 100vh;
  }
  .container {
    max-width: 960px;
    margin: 0 auto;
  }
  .page-title {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 0.25rem;
  }
  .page-subtitle {
    font-size: 0.875rem;
    color: var(--text-sub);
    margin-bottom: 2rem;
  }

  /* 検索バー */
  .search-bar {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }
  .search-bar input {
    flex: 1;
    padding: 0.75rem 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .search-bar input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(47,111,237,0.12);
  }
  .search-bar button {
    padding: 0.75rem 1.5rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .search-bar button:hover { background: var(--accent-hover); }
  .search-bar button:disabled { background: #a9b6cc; cursor: not-allowed; }

  /* ステータス */
  .status {
    padding: 0.75rem 1rem;
    border-radius: 8px;
    font-size: 0.875rem;
    margin-bottom: 1.5rem;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-sub);
  }
  .status.error { border-color: #f5c2c0; background: #fdf3f2; color: var(--danger); }
  .status.success { border-color: #b7e4d4; background: #f0faf6; color: var(--success); }

  /* 情報カード */
  .info-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    box-shadow: var(--shadow);
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
  }
  .info-thumb {
    width: 180px;
    height: 101px;
    border-radius: 8px;
    overflow: hidden;
    background: #eceff3;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-sub);
    font-size: 0.75rem;
  }
  .info-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info-body { flex: 1; min-width: 200px; }
  .info-title {
    font-size: 1.1rem;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 0.5rem;
    color: var(--text);
  }
  .info-channel {
    font-size: 0.875rem;
    color: var(--text-sub);
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .info-channel img {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: #eceff3;
  }
  .info-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 1.25rem;
    font-size: 0.8125rem;
    color: var(--text-sub);
  }
  .info-stats span { display: inline-flex; align-items: center; gap: 0.25rem; }
  .duration-pill {
    background: #eef2f8;
    color: #2f4a7a;
    border-radius: 999px;
    padding: 0.15rem 0.6rem;
    font-size: 0.75rem;
    font-weight: 500;
  }

  /* タブ */
  .tabs {
    display: flex;
    gap: 0.25rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1rem;
  }
  .tab {
    padding: 0.6rem 1rem;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-sub);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* ストリーム一覧 */
  .stream-list {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .stream-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.875rem 1.25rem;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .stream-row:last-child { border-bottom: none; }
  .stream-row:hover { background: #fafbfc; }
  .stream-meta {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex-wrap: wrap;
    flex: 1;
    min-width: 0;
  }
  .stream-quality {
    font-weight: 600;
    font-size: 0.875rem;
    color: var(--text);
    min-width: 64px;
  }
  .stream-codec {
    font-size: 0.75rem;
    color: var(--text-sub);
    background: #f0f2f5;
    padding: 0.15rem 0.55rem;
    border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .stream-size {
    font-size: 0.8125rem;
    color: var(--text-sub);
    min-width: 72px;
  }
  .stream-download {
    display: inline-block;
    padding: 0.45rem 1rem;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-size: 0.8125rem;
    font-weight: 500;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .stream-download:hover { background: var(--accent-hover); }

  .empty {
    padding: 2.5rem 1rem;
    text-align: center;
    color: var(--text-sub);
    font-size: 0.875rem;
  }

  .hidden { display: none !important; }

  /* ローディングバー */
  .loading-bar {
    height: 3px;
    background: #e2e5ea;
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 1.5rem;
    position: relative;
  }
  .loading-bar::after {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 30%;
    background: var(--accent);
    border-radius: 2px;
    animation: slide 1.2s ease-in-out infinite;
  }
  @keyframes slide {
    0% { left: -30%; }
    100% { left: 100%; }
  }

  .section-label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-sub);
    margin-bottom: 0.75rem;
  }
</style>
</head>
<body>
<div class="container">

  <div class="page-title">Video Stream Inspector</div>
  <div class="page-subtitle">動画IDを入力してストリーム情報を取得します</div>

  <div class="search-bar">
    <input type="text" id="videoId" placeholder="例: KRaWnd3LJfs" value="KRaWnd3LJfs">
    <button id="loadBtn">取得</button>
  </div>

  <div id="loadingBar" class="loading-bar hidden"></div>
  <div id="status" class="status hidden"></div>

  <!-- 動画情報 -->
  <div id="infoCard" class="info-card hidden">
    <div class="info-thumb" id="thumb">NO IMAGE</div>
    <div class="info-body">
      <div class="info-title" id="title">--</div>
      <div class="info-channel" id="channel">
        <img id="channelAvatar" src="" alt="" onerror="this.style.display='none'">
        <span id="channelName">--</span>
      </div>
      <div class="info-stats">
        <span id="views">--</span>
        <span id="likes">--</span>
        <span id="date">--</span>
        <span class="duration-pill" id="duration">--:--</span>
      </div>
    </div>
  </div>

  <!-- ストリーム -->
  <div id="streamSection" class="hidden">
    <div class="section-label">Available Streams</div>
    <div class="tabs">
      <button class="tab active" data-tab="combined">映像 + 音声</button>
      <button class="tab" data-tab="video">映像のみ</button>
      <button class="tab" data-tab="audio">音声のみ</button>
    </div>
    <div class="stream-list" id="streamList">
      <div class="empty">ストリームを読み込んでください</div>
    </div>
  </div>

</div>

<script>
(function () {
  const videoIdInput = document.getElementById('videoId');
  const loadBtn = document.getElementById('loadBtn');
  const loadingBar = document.getElementById('loadingBar');
  const statusEl = document.getElementById('status');
  const infoCard = document.getElementById('infoCard');
  const thumbEl = document.getElementById('thumb');
  const titleEl = document.getElementById('title');
  const channelAvatar = document.getElementById('channelAvatar');
  const channelName = document.getElementById('channelName');
  const viewsEl = document.getElementById('views');
  const likesEl = document.getElementById('likes');
  const dateEl = document.getElementById('date');
  const durationEl = document.getElementById('duration');
  const streamSection = document.getElementById('streamSection');
  const streamList = document.getElementById('streamList');
  const tabButtons = document.querySelectorAll('.tab');

  let watchData = null;
  let streamData = null;
  let activeTab = 'combined';

  function setStatus(msg, type) {
    statusEl.classList.remove('hidden', 'error', 'success');
    if (type) statusEl.classList.add(type);
    statusEl.textContent = msg;
  }
  function clearStatus() {
    statusEl.classList.add('hidden');
    statusEl.classList.remove('error', 'success');
  }
  function showLoading(show) {
    loadingBar.classList.toggle('hidden', !show);
  }
  function formatBytes(b) {
    if (!b || b <= 0) return '—';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(b) / Math.log(k));
    return (b / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
  }
  function formatDuration(sec) {
    if (sec == null || isNaN(sec)) return '--:--';
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    return `${m}:${String(s).padStart(2,'0')}`;
  }

  function setActiveTab(tab) {
    activeTab = tab;
    tabButtons.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    if (streamData) renderStreams();
  }

  tabButtons.forEach(b => b.addEventListener('click', () => setActiveTab(b.dataset.tab)));

  function renderStreams() {
    const s = streamData || {};
    const progressive = s.progressive || [];
    const videos = s.videos || [];
    const audios = s.audios || [];
    const directUrls = s.directUrls || {};

    let items = [];

    if (activeTab === 'combined') {
      progressive.forEach(x => {
        const url = x.url || directUrls[x.itag] || null;
        if (url) {
          items.push({
            quality: x.qualityLabel || '—',
            codec: x.mime || '',
            size: x.contentLength ? formatBytes(x.contentLength) : '—',
            url,
            itag: x.itag
          });
        }
      });
      if (directUrls['18'] && !items.some(i => i.itag === 18)) {
        items.push({ quality: '360p', codec: 'video/mp4', size: '—', url: directUrls['18'], itag: 18 });
      }
      if (directUrls['22'] && !items.some(i => i.itag === 22)) {
        items.push({ quality: '720p', codec: 'video/mp4', size: '—', url: directUrls['22'], itag: 22 });
      }
      // 重複排除
      const seen = new Set();
      items = items.filter(i => { if (seen.has(i.itag)) return false; seen.add(i.itag); return true; });
    } else if (activeTab === 'video') {
      videos.forEach(x => {
        const url = x.url || directUrls[x.itag] || null;
        if (url) {
          items.push({
            quality: x.qualityLabel || '—',
            codec: x.mime || '',
            size: x.contentLength ? formatBytes(x.contentLength) : '—',
            url,
            itag: x.itag,
            bitrate: x.bitrate || 0
          });
        }
      });
    } else if (activeTab === 'audio') {
      audios.forEach(x => {
        const url = x.url || directUrls[x.itag] || null;
        if (url) {
          items.push({
            quality: x.qualityLabel || 'audio',
            codec: x.mime || '',
            size: x.contentLength ? formatBytes(x.contentLength) : '—',
            url,
            itag: x.itag,
            bitrate: x.bitrate || 0
          });
        }
      });
    }

    if (items.length === 0) {
      streamList.innerHTML = '<div class="empty">このカテゴリにストリームがありません</div>';
      return;
    }

    streamList.innerHTML = items.map(i => {
      const codecShort = i.codec ? (i.codec.split('/')[1] || i.codec) : '—';
      return `
        <div class="stream-row">
          <div class="stream-meta">
            <span class="stream-quality">${i.quality}</span>
            <span class="stream-codec">${codecShort}</span>
            <span class="stream-size">${i.size}</span>
          </div>
          <a class="stream-download" href="${i.url}" target="_blank" rel="noopener noreferrer">ダウンロード</a>
        </div>
      `;
    }).join('');
  }

  async function load() {
    const id = videoIdInput.value.trim();
    if (!id) { setStatus('動画IDを入力してください', 'error'); return; }

    loadBtn.disabled = true;
    showLoading(true);
    clearStatus();
    infoCard.classList.add('hidden');
    streamSection.classList.add('hidden');

    try {
      // 詳細情報（watch）
      const watchRes = await fetch(`/api/watch/${encodeURIComponent(id)}`);
      if (!watchRes.ok) throw new Error('詳細情報の取得に失敗 (' + watchRes.status + ')');
      watchData = await watchRes.json();

      // ストリーム情報（stream）
      const streamRes = await fetch(`/api/stream?v=${encodeURIComponent(id)}`);
      if (!streamRes.ok) throw new Error('ストリームの取得に失敗 (' + streamRes.status + ')');
      streamData = await streamRes.json();

      // 詳細表示
      titleEl.textContent = watchData.title || 'タイトルなし';
      channelName.textContent = (watchData.channel && watchData.channel.name) || '不明';
      if (watchData.channel && watchData.channel.avatar) {
        channelAvatar.src = watchData.channel.avatar;
        channelAvatar.style.display = 'inline';
      } else {
        channelAvatar.style.display = 'none';
      }
      viewsEl.textContent = '視聴 ' + (watchData.viewCount || '—');
      likesEl.textContent = '高評価 ' + (watchData.likeCount || '—');
      dateEl.textContent = watchData.dateText || '—';
      durationEl.textContent = formatDuration(watchData.lengthSeconds);
      thumbEl.innerHTML = `<img src="https://i.ytimg.com/vi/${watchData.videoId}/hqdefault.jpg" alt="" onerror="this.parentElement.textContent='NO IMAGE'">`;

      infoCard.classList.remove('hidden');
      streamSection.classList.remove('hidden');
      setActiveTab(activeTab);

      setStatus('取得しました', 'success');
      setTimeout(clearStatus, 2500);
    } catch (e) {
      console.error(e);
      setStatus(e.message || 'エラーが発生しました', 'error');
    } finally {
      loadBtn.disabled = false;
      showLoading(false);
    }
  }

  loadBtn.addEventListener('click', load);
  videoIdInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); load(); }
  });

  // 初期ロード
  window.addEventListener('load', () => {
    if (videoIdInput.value.trim()) {
      setTimeout(load, 200);
    }
  });
})();
</script>
</body>
</html>
