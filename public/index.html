<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Status Console</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #1c2128;
      --border: #30363d;
      --text: #c9d1d9;
      --text-dim: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --purple: #bc8cff;
    }
    html, body {
      height: 100%;
    }
    body {
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .app {
      max-width: 1200px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .title-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #f0f6fc;
      letter-spacing: -0.3px;
      font-family: 'Consolas', 'Monaco', monospace;
    }
    .subtitle {
      font-size: 0.8rem;
      color: var(--text-dim);
      font-family: 'Consolas', 'Monaco', monospace;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .controls input {
      padding: 0.55rem 0.9rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 0.85rem;
      font-family: 'Consolas', 'Monaco', monospace;
      outline: none;
      width: 220px;
      transition: border 0.15s, box-shadow 0.15s;
    }
    .controls input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
    }
    .btn {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.55rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: 'Consolas', 'Monaco', monospace;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover {
      background: #21262d;
      border-color: #484f58;
    }
    .btn.primary {
      background: #238636;
      border-color: #2ea043;
      color: #ffffff;
    }
    .btn.primary:hover {
      background: #2ea043;
    }
    .btn.danger {
      background: #6e2020;
      border-color: #b62324;
      color: #ffffff;
    }
    .btn.danger:hover {
      background: #b62324;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ステータスグリッド */
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 0.8rem;
    }
    .status-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: border-color 0.2s;
    }
    .status-card.ok { border-color: rgba(63, 185, 80, 0.5); }
    .status-card.error { border-color: rgba(248, 81, 73, 0.5); }
    .status-card.loading { border-color: rgba(210, 153, 34, 0.5); }
    .status-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .status-card-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: #f0f6fc;
      font-family: 'Consolas', 'Monaco', monospace;
    }
    .status-card-method {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      background: #1f6feb;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .status-card-url {
      font-size: 0.72rem;
      color: var(--text-dim);
      font-family: 'Consolas', 'Monaco', monospace;
      word-break: break-all;
    }
    .status-card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .pill {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15rem 0.55rem;
      border-radius: 20px;
      font-family: 'Consolas', 'Monaco', monospace;
      background: #21262d;
      color: var(--text-dim);
    }
    .pill.ok { background: rgba(63, 185, 80, 0.15); color: var(--green); }
    .pill.error { background: rgba(248, 81, 73, 0.15); color: var(--red); }
    .pill.loading { background: rgba(210, 153, 34, 0.15); color: var(--yellow); }
    .pill.json { background: rgba(210, 153, 34, 0.15); color: var(--yellow); }
    .pill.video { background: rgba(188, 140, 255, 0.15); color: var(--purple); }

    /* コンソール */
    .console-panel {
      background: #010409;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 380px;
    }
    .console-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .console-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-dim);
      font-family: 'Consolas', 'Monaco', monospace;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .console-title::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
    }
    .console-actions {
      display: flex;
      gap: 6px;
    }
    .console-actions button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 4px;
      padding: 0.2rem 0.6rem;
      font-size: 0.72rem;
      font-family: 'Consolas', 'Monaco', monospace;
      cursor: pointer;
    }
    .console-actions button:hover {
      background: var(--panel-2);
      color: var(--text);
    }
    .console-log {
      flex: 1;
      overflow-y: auto;
      padding: 0.8rem 1rem;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.78rem;
      line-height: 1.6;
      min-height: 320px;
      max-height: 520px;
    }
    .log-line {
      display: flex;
      gap: 10px;
      padding: 0.1rem 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .log-time {
      color: #484f58;
      flex-shrink: 0;
    }
    .log-level {
      flex-shrink: 0;
      font-weight: 700;
      width: 60px;
    }
    .log-level.info { color: var(--accent); }
    .log-level.ok { color: var(--green); }
    .log-level.warn { color: var(--yellow); }
    .log-level.error { color: var(--red); }
    .log-level.debug { color: var(--text-dim); }
    .log-msg {
      color: var(--text);
      flex: 1;
    }
    .log-line.error .log-msg {
      color: #ffa198;
    }
    .log-line.ok .log-msg {
      color: #aff5b4;
    }
    .log-line.warn .log-msg {
      color: #f0e6a8;
    }

    /* スクロールバー */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0d1117;
    }
    ::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #484f58;
    }

    /* レスポンシブ */
    @media (max-width: 640px) {
      body { padding: 0.8rem; }
      .controls input { width: 100%; }
      .status-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title-group">
      <div class="title-dot"></div>
      <div>
        <h1>API Status Console</h1>
        <div class="subtitle" id="lastUpdated">待機中...</div>
      </div>
    </div>
    <div class="controls">
      <input type="text" id="videoIdInput" placeholder="動画ID または URL" value="dQw4w9WgXcQ">
      <button class="btn primary" id="checkNowBtn">今すぐチェック</button>
      <button class="btn" id="toggleAutoBtn">自動停止</button>
    </div>
  </div>

  <div class="status-grid" id="statusGrid"></div>

  <div class="console-panel">
    <div class="console-header">
      <div class="console-title">console</div>
      <div class="console-actions">
        <button id="clearLogBtn">クリア</button>
      </div>
    </div>
    <div class="console-log" id="consoleLog"></div>
  </div>
</div>

<script>
  (function() {
    const AUTO_INTERVAL_MS = 30000; // 30秒ごと

    const videoIdInput = document.getElementById('videoIdInput');
    const checkNowBtn = document.getElementById('checkNowBtn');
    const toggleAutoBtn = document.getElementById('toggleAutoBtn');
    const clearLogBtn = document.getElementById('clearLogBtn');
    const statusGrid = document.getElementById('statusGrid');
    const consoleLog = document.getElementById('consoleLog');
    const lastUpdated = document.getElementById('lastUpdated');

    let autoTimer = null;
    let autoEnabled = true;
    let checking = false;
    let currentVideoId = null;

    // エンドポイント定義
    const ENDPOINTS = [
      {
        id: 'watch',
        name: 'watch',
        method: 'GET',
        type: 'json',
        url: (id) => `/api/watch/${encodeURIComponent(id)}`,
        label: '詳細情報 (JSON)',
      },
      {
        id: 'stream',
        name: 'stream',
        method: 'GET',
        type: 'video',
        url: (id) => `/api/stream?v=${encodeURIComponent(id)}`,
        label: '動画ストリーム (mp4)',
      },
      {
        id: 'json',
        name: 'json',
        method: 'GET',
        type: 'json',
        url: (id) => `/api/json?v=${encodeURIComponent(id)}`,
        label: '整形済み JSON',
      },
    ];

    // ============ ログ ============
    function pad(n) {
      return String(n).padStart(2, '0');
    }
    function timestamp() {
      const d = new Date();
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }
    function log(level, msg) {
      const line = document.createElement('div');
      line.className = `log-line ${level}`;
      line.innerHTML = `
        <span class="log-time">[${timestamp()}]</span>
        <span class="log-level ${level}">${level.toUpperCase()}</span>
        <span class="log-msg"></span>
      `;
      line.querySelector('.log-msg').textContent = msg;
      consoleLog.appendChild(line);
      consoleLog.scrollTop = consoleLog.scrollHeight;
    }

    // ============ ステータスカード描画 ============
    function renderStatusCards() {
      statusGrid.innerHTML = '';
      ENDPOINTS.forEach((ep) => {
        const card = document.createElement('div');
        card.className = 'status-card';
        card.dataset.endpointId = ep.id;
        card.innerHTML = `
          <div class="status-card-top">
            <div class="status-card-name">${ep.name}</div>
            <span class="status-card-method">${ep.method}</span>
          </div>
          <div class="status-card-url" data-role="url">-</div>
          <div class="status-card-bottom">
            <span class="pill" data-role="status">待機中</span>
            <span class="pill" data-role="type">-</span>
          </div>
        `;
        statusGrid.appendChild(card);
      });
    }

    function getCard(endpointId) {
      return statusGrid.querySelector(`[data-endpoint-id="${endpointId}"]`);
    }

    function setCardState(endpointId, state, statusText, typeText) {
      const card = getCard(endpointId);
      if (!card) return;
      card.classList.remove('ok', 'error', 'loading');
      if (state) card.classList.add(state);

      const statusPill = card.querySelector('[data-role="status"]');
      statusPill.textContent = statusText;
      statusPill.className = 'pill';
      if (state === 'ok') statusPill.classList.add('ok');
      else if (state === 'error') statusPill.classList.add('error');
      else if (state === 'loading') statusPill.classList.add('loading');

      if (typeText !== undefined) {
        const typePill = card.querySelector('[data-role="type"]');
        typePill.textContent = typeText;
        typePill.className = 'pill';
        if (typeText === 'JSON') typePill.classList.add('json');
        else if (typeText === 'MP4') typePill.classList.add('video');
      }
    }

    function setCardUrl(endpointId, url) {
      const card = getCard(endpointId);
      if (!card) return;
      card.querySelector('[data-role="url"]').textContent = url;
    }

    // ============ チェック処理 ============
    function extractVideoId(input) {
      if (!input) return null;
      const trimmed = input.trim();
      if (/^[A-Za-z0-9_-]{11}$/.test(trimmed)) return trimmed;
      try {
        const url = new URL(trimmed);
        const hostname = url.hostname.replace(/^www\./, '');
        if (hostname === 'youtu.be') {
          const id = url.pathname.slice(1).split('/')[0];
          if (/^[A-Za-z0-9_-]{11}$/.test(id)) return id;
        }
        if (hostname === 'youtube.com' || hostname === 'm.youtube.com') {
          const v = url.searchParams.get('v');
          if (v && /^[A-Za-z0-9_-]{11}$/.test(v)) return v;
          const pathParts = url.pathname.split('/').filter(Boolean);
          if (pathParts.length >= 2) {
            const prefix = pathParts[0];
            const id = pathParts[1];
            if (['embed', 'shorts', 'v'].includes(prefix) && /^[A-Za-z0-9_-]{11}$/.test(id)) {
              return id;
            }
          }
        }
      } catch (e) { /* not a URL */ }
      return null;
    }

    async function checkJsonEndpoint(ep, videoId) {
      const url = ep.url(videoId);
      setCardUrl(ep.id, url);
      setCardState(ep.id, 'loading', '取得中...', '-');
      log('info', `GET ${url}`);

      try {
        const t0 = performance.now();
        const res = await fetch(url);
        const elapsed = Math.round(performance.now() - t0);
        const contentType = res.headers.get('content-type') || '';
        const text = await res.text();

        let typeLabel = '-';
        if (contentType.includes('application/json')) typeLabel = 'JSON';
        else if (contentType.includes('video')) typeLabel = 'MP4';

        if (res.ok) {
          setCardState(ep.id, 'ok', `${res.status} ${elapsed}ms`, typeLabel);
          log('ok', `← ${res.status} ${contentType} (${elapsed}ms, ${text.length}B)`);

          // JSON を整形して最初の数行をログに出す
          try {
            const parsed = JSON.parse(text);
            const preview = JSON.stringify(parsed, null, 2).split('\n').slice(0, 6).join('\n');
            log('debug', preview + (preview.split('\n').length >= 6 ? '\n...' : ''));
          } catch (e) {
            // JSON でない
          }
        } else {
          setCardState(ep.id, 'error', `${res.status} ${elapsed}ms`, typeLabel);
          log('error', `← ${res.status} ${contentType} (${elapsed}ms)`);
          log('error', text.slice(0, 200));
        }
      } catch (err) {
        setCardState(ep.id, 'error', 'NETWORK ERR', '-');
        log('error', `Network error: ${err.message}`);
      }
    }

    async function checkVideoEndpoint(ep, videoId) {
      const url = ep.url(videoId);
      setCardUrl(ep.id, url);
      setCardState(ep.id, 'loading', '取得中...', '-');
      log('info', `GET ${url} (Range: bytes=0-0)`);

      try {
        const t0 = performance.now();
        const res = await fetch(url, { headers: { 'Range': 'bytes=0-0' } });
        const elapsed = Math.round(performance.now() - t0);
        const contentType = res.headers.get('content-type') || '';
        const contentLength = res.headers.get('content-length') || '-';
        const contentRange = res.headers.get('content-range') || '-';

        try { await res.arrayBuffer(); } catch (e) { /* noop */ }

        let typeLabel = '-';
        if (contentType.includes('video')) typeLabel = 'MP4';
        else if (contentType.includes('application/json')) typeLabel = 'JSON';

        if (res.ok || res.status === 206) {
          setCardState(ep.id, 'ok', `${res.status} ${elapsed}ms`, typeLabel);
          log('ok', `← ${res.status} ${contentType} (${elapsed}ms, len=${contentLength})`);
          log('debug', `content-range: ${contentRange}`);
        } else {
          setCardState(ep.id, 'error', `${res.status} ${elapsed}ms`, typeLabel);
          log('error', `← ${res.status} ${contentType} (${elapsed}ms)`);
        }
      } catch (err) {
        setCardState(ep.id, 'error', 'NETWORK ERR', '-');
        log('error', `Network error: ${err.message}`);
      }
    }

    async function runChecks() {
      if (checking) {
        log('warn', 'チェック実行中のため、スキップしました');
        return;
      }
      const videoId = extractVideoId(videoIdInput.value);
      if (!videoId) {
        log('error', '有効な動画IDまたはYouTube URLを入力してください');
        return;
      }

      checking = true;
      currentVideoId = videoId;
      checkNowBtn.disabled = true;

      log('info', `===== チェック開始: ${videoId} =====`);
      lastUpdated.textContent = `最終更新: ${new Date().toLocaleTimeString()}`;

      for (const ep of ENDPOINTS) {
        if (ep.type === 'json') {
          await checkJsonEndpoint(ep, videoId);
        } else if (ep.type === 'video') {
          await checkVideoEndpoint(ep, videoId);
        }
      }

      log('ok', `===== チェック完了: ${videoId} =====`);
      checking = false;
      checkNowBtn.disabled = false;
    }

    // ============ 自動チェック ============
    function startAuto() {
      stopAuto();
      autoEnabled = true;
      toggleAutoBtn.textContent = '自動停止';
      toggleAutoBtn.classList.remove('danger');
      log('info', `自動チェックを開始しました (${AUTO_INTERVAL_MS / 1000}秒間隔)`);
      autoTimer = setInterval(runChecks, AUTO_INTERVAL_MS);
    }

    function stopAuto() {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
      }
      autoEnabled = false;
      toggleAutoBtn.textContent = '自動再開';
      toggleAutoBtn.classList.add('danger');
    }

    // ============ イベント ============
    checkNowBtn.addEventListener('click', runChecks);

    toggleAutoBtn.addEventListener('click', () => {
      if (autoEnabled) {
        stopAuto();
        log('warn', '自動チェックを停止しました');
      } else {
        startAuto();
      }
    });

    clearLogBtn.addEventListener('click', () => {
      consoleLog.innerHTML = '';
      log('info', 'ログをクリアしました');
    });

    videoIdInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        runChecks();
      }
    });

    // ============ 初期化 ============
    renderStatusCards();
    log('info', 'API Status Console 起動');
    log('debug', `自動チェック間隔: ${AUTO_INTERVAL_MS / 1000}秒`);

    // 起動時に1回チェック → その後自動開始
    (async () => {
      await runChecks();
      startAuto();
    })();
  })();

</script>

  <script src="https://cdn.jsdelivr.net/gh/KA1121Studio/netlify-badge@main/block-netlify-badge.js"></script>
</body>
</html>
